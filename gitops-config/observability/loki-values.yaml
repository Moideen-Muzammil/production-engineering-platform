deploymentMode: Monolithic

singleBinary:
  replicas: 1

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

loki:
  auth_enabled: false
  useTestSchema: true
  storage:
    type: filesystem
