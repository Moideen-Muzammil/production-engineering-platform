
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install validation tools
        working-directory: app-source
        run: make install-tools

      - name: Install Lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Run source checks
        working-directory: app-source
        run: make check


  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build application images with cache
        working-directory: app-source
        shell: bash
        run: |
          set -a
          source ci.env
          set +a

          services=(
            accounting ad cart checkout currency email flagd-ui
            fraud-detection frontend frontend-proxy image-provider
            kafka load-generator payment product-catalog quote
            recommendation shipping telemetry-docs
          )

          for service in "${services[@]}"; do
            echo "Building ${service} with cache..."

            docker buildx bake \
              -f compose.yaml \
              -f compose.full.yaml \
              --load \
              --set "${service}.cache-from=type=gha,scope=${service}" \
              --set "${service}.cache-to=type=gha,scope=${service},mode=max" \
              "$service"
          done

